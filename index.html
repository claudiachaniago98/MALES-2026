<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MALES — Fashion, identity, consciousness."
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>MALES</title>

  <link
    rel="icon"
    type="image/png"
    href="assets/brand/favicon.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- ==================================================
       HEADER
       ================================================== -->

  <header
    id="siteHeader"
    class="site-header"
  >

    <div class="header-inner">

      <a
        href="#top"
        class="brand"
        aria-label="MALES Home"
      >

        <img
          id="brandLogo"
          src=""
          alt="MALES"
        >

      </a>


      <nav
        id="mainNavigation"
        class="main-navigation"
      >
      </nav>


      <button
        id="menuButton"
        class="menu-button"
        aria-label="Open Menu"
        type="button"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>

    </div>

  </header>



  <main id="top">


    <!-- ==================================================
         HERO
         ================================================== -->

    <section
      id="hero"
      class="hero"
    >

      <div class="hero-background">

        <img
          id="heroImage"
          src=""
          alt=""
        >

      </div>


      <div class="hero-content">

        <p
          id="heroEyebrow"
          class="eyebrow"
        ></p>


        <h1
          id="heroTitle"
          class="hero-title"
        ></h1>


        <p
          id="heroDescription"
          class="hero-description"
        ></p>


        <a
          id="heroButton"
          href="#collection"
          class="luxury-button"
        ></a>

      </div>

    </section>



    <!-- ==================================================
         RUNNING MESSAGE
         ================================================== -->

    <section
      class="ticker"
      aria-label="MALES Philosophy"
    >

      <div
        id="tickerTrack"
        class="ticker-track"
      >
      </div>

    </section>



    <!-- ==================================================
         PHILOSOPHY
         ================================================== -->

    <section
      id="philosophy"
      class="content-section philosophy-section"
    >

      <div class="section-container">

        <p
          id="philosophyEyebrow"
          class="eyebrow"
        ></p>


        <h2
          id="philosophyTitle"
          class="section-title"
        ></h2>


        <p
          id="philosophyDescription"
          class="large-text"
        ></p>

      </div>

    </section>



    <!-- ==================================================
         COLLECTION
         ================================================== -->

    <section
      id="collection"
      class="content-section collection-section"
    >

      <div class="section-container">


        <div class="section-heading">

          <div>

            <p class="eyebrow">
              THE COLLECTION
            </p>

            <h2 class="section-title">
              Find Your MALES
            </h2>

          </div>


          <div class="collection-filters">

            <select
              id="genderFilter"
              aria-label="Filter Gender"
            >

              <option value="">
                Semua
              </option>

            </select>


            <select
              id="categoryFilter"
              aria-label="Filter Category"
            >

              <option value="">
                Semua Kategori
              </option>

            </select>

          </div>

        </div>



        <div
          id="productsGrid"
          class="products-grid"
        >
        </div>

      </div>

    </section>



    <!-- ==================================================
         STORY
         ================================================== -->

    <section
      id="story"
      class="content-section story-section"
    >

      <div class="section-container story-grid">


        <div>

          <p
            id="storyEyebrow"
            class="eyebrow"
          ></p>


          <h2
            id="storyTitle"
            class="section-title"
          ></h2>

        </div>


        <div
          id="storyContent"
          class="story-content"
        >
        </div>

      </div>

    </section>



    <!-- ==================================================
         FIND MY MALES SIZE
         ================================================== -->

    <section
      id="size"
      class="content-section size-section"
    >

      <div class="section-container">


        <p class="eyebrow">
          FIND MY MALES
        </p>


        <h2 class="section-title">
          Recommended Size
        </h2>


        <p
          id="sizeDescription"
          class="large-text"
        ></p>



        <div class="size-tool">


          <div class="measurement-field">

            <label for="chestInput">
              Lingkar Dada (cm)
            </label>

            <input
              id="chestInput"
              type="number"
              min="1"
              placeholder="Contoh: 100"
            >

          </div>



          <div class="measurement-field">

            <label for="heightInput">
              Tinggi Badan (cm)
            </label>

            <input
              id="heightInput"
              type="number"
              min="1"
              placeholder="Contoh: 175"
            >

          </div>



          <button
            id="findSizeButton"
            class="luxury-button"
            type="button"
          >
            FIND MY SIZE
          </button>


          <div
            id="sizeResult"
            class="size-result"
          >
          </div>

        </div>



        <div
          id="sizeGuide"
          class="size-guide"
        >
        </div>

      </div>

    </section>



    <!-- ==================================================
         SOCIAL MEDIA
         ================================================== -->

    <section
      id="social"
      class="content-section social-section"
    >

      <div class="section-container">


        <img
          id="footerLogo"
          class="footer-logo"
          src=""
          alt="MALES"
        >


        <h2 class="section-title">
          MALES WORLDWIDE
        </h2>


        <div
          id="socialLinks"
          class="social-links"
        >
        </div>

      </div>

    </section>



    <!-- ==================================================
         CONTACT
         ================================================== -->

    <section
      id="contact"
      class="content-section contact-section"
    >

      <div class="section-container">


        <p class="eyebrow">
          CONTACT
        </p>


        <h2 class="section-title">
          Connect with MALES
        </h2>


        <p class="large-text">
          Untuk pemesanan dan informasi produk,
          hubungi MALES melalui WhatsApp.
        </p>


        <a
          id="whatsappButton"
          class="luxury-button"
          href="#"
          target="_blank"
          rel="noopener"
        >
          WHATSAPP ADMIN
        </a>

      </div>

    </section>

  </main>



  <!-- ==================================================
       FOOTER
       ================================================== -->

  <footer class="site-footer">

    <div>

      <p id="footerTagline"></p>

    </div>


    <div>

      <p>
        <span id="footerCopyright"></span>
        © <span id="footerYear"></span>
      </p>

    </div>

  </footer>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="config.js"></script>

  <script src="script.js"></script>


</body>

  </html>
